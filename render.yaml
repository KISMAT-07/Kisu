databases:
  - name: kisu-cms-db
    plan: free
    databaseName: kisu_cms
    user: kisu_cms

services:
  - type: web
    name: kisu-cms-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: sh scripts/start.sh
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: kisu-cms-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://kisu-cms-admin-nhh0.onrender.com,https://kisu-cms-site.onrender.com
      - key: PUBLIC_UPLOAD_BASE_URL
        value: https://kisu-cms-api-8ulj.onrender.com/uploads
      - key: UPLOAD_MOUNT_PATH
        value: /uploads
      - key: UPLOAD_DIR
        value: /opt/render/project/src/backend/uploads

  - type: web
    name: kisu-cms-admin
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://kisu-cms-api-8ulj.onrender.com/api/v1

  - type: web
    name: kisu-cms-site
    runtime: static
    rootDir: portfolio
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://kisu-cms-api-8ulj.onrender.com/api/v1
